spring:
  datasource:
    url: jdbc:h2:file:./.h2/shangluhua;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true