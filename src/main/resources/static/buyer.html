<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商陆花 · 批发选购</title>
  <style>
    :root {
      --bg: #fbf7ea;
      --paper: #fffdf6;
      --ink: #382b1f;
      --muted: #7d6b52;
      --line: #eadfbe;
      --accent: #d59a27;
      --accent-dark: #8a5618;
      --danger: #9d3f24;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app-header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    .app-header h1 { font-size: 18px; }
    .cart-icon {
      position: relative;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #fff4ce;
      font-weight: 800;
      cursor: pointer;
      border: 0;
      color: var(--ink);
      font-size: 14px;
    }
    .cart-count {
      display: inline-flex;
      align-items: center; justify-content: center;
      min-width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--accent-dark);
      color: #fff;
      font-size: 12px;
    }
    main { padding: 16px; max-width: 480px; margin: 0 auto; }

    .product-card {
      display: flex;
      gap: 14px;
      margin-bottom: 12px;
      padding: 14px;
      border-radius: 10px;
      background: var(--paper);
      border: 1px solid var(--line);
    }
    .product-card img {
      width: 100px; height: 100px;
      object-fit: cover;
      border-radius: 8px;
      background: #f8e8bc;
      flex-shrink: 0;
    }
    .product-info { flex: 1; min-width: 0; }
    .product-info h3 { font-size: 16px; margin-bottom: 4px; }
    .product-info .code { font-size: 12px; color: var(--muted); }
    .product-info .price { font-size: 20px; font-weight: 800; color: var(--accent-dark); margin: 6px 0; }
    .sku-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }
    .sku-btn {
      padding: 4px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      background: #fffdf8;
      cursor: pointer;
      color: var(--ink);
    }
    .sku-btn.active {
      background: var(--accent-dark);
      color: #fff;
      border-color: var(--accent-dark);
    }
    .qty-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .qty-btn {
      width: 32px; height: 32px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fffdf8;
      font-size: 18px;
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--ink);
    }
    .qty-row span { font-size: 16px; font-weight: 800; min-width: 24px; text-align: center; }
    .add-cart-btn {
      margin-top: 8px;
      padding: 8px 0;
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: var(--accent-dark);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .add-cart-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Cart drawer */
    .cart-overlay {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(56,43,31,0.5);
      display: none;
    }
    .cart-overlay.open { display: block; }
    .cart-drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 21;
      max-height: 70vh;
      overflow-y: auto;
      border-radius: 16px 16px 0 0;
      background: var(--paper);
      padding: 20px 16px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    .cart-overlay.open .cart-drawer { transform: translateY(0); }
    .cart-drawer h2 { margin-bottom: 12px; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .cart-item .name { font-weight: 700; }
    .cart-item .meta { font-size: 13px; color: var(--muted); }
    .cart-item .item-total { font-weight: 800; color: var(--accent-dark); }
    .cart-item .remove-btn {
      width: 28px; height: 28px;
      border: 0;
      border-radius: 50%;
      background: #f8d7da;
      color: var(--danger);
      font-weight: 800;
      cursor: pointer;
    }
    .cart-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      font-size: 18px;
      font-weight: 800;
    }
    .checkout-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--accent-dark);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .checkout-form {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
    .checkout-form label {
      display: grid;
      gap: 4px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
    }
    .checkout-form input {
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      background: #fffdf8;
    }
    .order-success {
      text-align: center;
      padding: 40px 0;
    }
    .order-success h2 { color: var(--accent-dark); margin-bottom: 12px; }
    .order-success p { color: var(--muted); }
    .toast {
      position: fixed;
      left: 50%; bottom: 30px;
      transform: translateX(-50%) translateY(12px);
      padding: 12px 24px;
      border-radius: 8px;
      background: #392616;
      color: #fffaf0;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      font-size: 14px;
    }
    .toast { z-index: 30; } .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 420px) {
      .product-card img { width: 80px; height: 80px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>商陆花 · 批发采购</h1>
    <div style="display:flex;gap:8px">
      <button class="cart-icon" id="historyBtn" style="background:var(--paper);border:1px solid var(--line)">历史订单</button>
      <button class="cart-icon" id="cartBtn">
        选购单 <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main id="app">
    <div id="productView">
      <div id="productList"></div>
    </div>
    <div id="historyView" style="display:none">
      <div style="margin-bottom:16px">
        <label style="display:grid;gap:6px;color:var(--muted);font-size:13px;font-weight:800">
          输入手机号查看历史订单
          <div style="display:flex;gap:8px">
            <input id="historyPhone" type="tel" placeholder="13800000000" style="flex:1;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fffdf8" />
            <button id="historySearchBtn" style="height:44px;padding:0 20px;border:0;border-radius:8px;background:var(--accent-dark);color:#fff;font-weight:800;cursor:pointer">查询</button>
          </div>
        </label>
      </div>
      <div id="orderList"></div>
    </div>
  </main>

  <!-- Cart overlay -->
  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-drawer">
      <h2>选购单</h2>
      <div id="cartItems"></div>
      <div id="checkoutArea" style="display:none">
        <div class="cart-summary">
          <span>合计</span>
          <span id="cartTotal">¥0.00</span>
        </div>
        <div class="checkout-form">
          <label>联系人 <input id="contactName" placeholder="您的姓名" /></label>
          <label>手机号 <input id="contactPhone" type="tel" placeholder="13800000000" /></label>
          <label>备注 <input id="orderNote" placeholder="可选" /></label>
        </div>
        <button class="checkout-btn" id="checkoutBtn">提交采购单</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const images = [
      "/assets/product-shirt.png",
      "/assets/product-dress.png",
      "/assets/product-set.png",
      "/assets/hero-look.png",
    ];

    let products = [];
    let cart = [];
    const selectedSku = {}; // productId -> { color, size }
    const quantities = {};  // comboKey -> qty

    function $(id) { return document.getElementById(id); }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function money(v) { return Number(v || 0).toFixed(2); }

    function comboKey(productId, color, size) { return `${productId}-${color}-${size}`; }

    function updateCartUI() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      $("cartCount").textContent = count;

      const container = $("cartItems");
      if (!cart.length) {
        container.innerHTML = `<p style="color:var(--muted);padding:24px 0;text-align:center">选购单为空，请先选择商品</p>`;
        $("checkoutArea").style.display = "none";
        return;
      }
      $("checkoutArea").style.display = "block";

      let total = 0;
      container.innerHTML = cart.map((item, idx) => {
        total += item.amount;
        return `
          <div class="cart-item">
            <div>
              <div class="name">${item.name}</div>
              <div class="meta">${item.color} / ${item.size} × ${item.qty}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <span class="item-total">¥${money(item.amount)}</span>
              <button class="remove-btn" data-remove="${idx}">✕</button>
            </div>
          </div>
        `;
      }).join("");
      $("cartTotal").textContent = `¥${money(total)}`;
    }

    function addToCart(productId) {
      const sel = selectedSku[productId];
      if (!sel || !sel.color || !sel.size) {
        toast("请先选择颜色和尺码");
        return;
      }
      const key = comboKey(productId, sel.color, sel.size);
      const qty = quantities[key] || 1;
      if (qty <= 0) { toast("数量必须大于0"); return; }

      const product = products.find(p => String(p.id) === String(productId));
      if (!product) return;
      const sku = (product.skus || []).find(s => s.colorName === sel.color && s.sizeName === sel.size);
      if (!sku) return;

      const existing = cart.find(i => i.key === key);
      if (existing) {
        existing.qty += qty;
        existing.amount = existing.qty * existing.unitPrice;
      } else {
        cart.push({
          key,
          skuId: sku.id,
          name: product.name,
          color: sel.color,
          size: sel.size,
          qty,
          unitPrice: Number(sku.wholesalePrice || product.wholesalePrice || 0),
          amount: qty * Number(sku.wholesalePrice || product.wholesalePrice || 0),
        });
      }
      quantities[key] = 1;
      updateCartUI();
      toast(`已添加 ${product.name} (${sel.color}/${sel.size}) × ${qty}`);
    }

    function renderSkuSelector(product) {
      const colors = [...new Set((product.skus || []).map(s => s.colorName).filter(Boolean))];
      const sizes = [...new Set((product.skus || []).map(s => s.sizeName).filter(Boolean))];
      const sel = selectedSku[product.id] || {};
      const key = comboKey(product.id, sel.color, sel.size);
      const qty = quantities[key] || 1;

      return `
        <div style="margin-top:8px">
          <div class="sku-selector">
            ${colors.map(c => `<button class="sku-btn ${sel.color === c ? "active" : ""}" data-color="${product.id}:${c}">${c}</button>`).join("")}
          </div>
          <div class="sku-selector">
            ${sizes.map(s => `<button class="sku-btn ${sel.size === s ? "active" : ""}" data-size="${product.id}:${s}">${s}</button>`).join("")}
          </div>
          <div class="qty-row">
            <button class="qty-btn" data-dec="${product.id}">−</button>
            <span>${qty}</span>
            <button class="qty-btn" data-inc="${product.id}">+</button>
          </div>
          <button class="add-cart-btn" data-add="${product.id}">加入选购单</button>
        </div>
      `;
    }

    function renderProducts() {
      const container = $("productList");
      if (!products.length) {
        container.innerHTML = `<p style="text-align:center;padding:40px 0;color:var(--muted)">暂无商品</p>`;
        return;
      }
      container.innerHTML = products.map((p, idx) => `
        <div class="product-card">
          <img src="${images[idx % images.length]}" alt="${p.name}" />
          <div class="product-info">
            <h3>${p.name || ""}</h3>
            <div class="code">${p.code || ""} ／ ${p.category || ""}</div>
            <div class="price">¥${money(p.wholesalePrice)}</div>
            ${renderSkuSelector(p)}
          </div>
        </div>
      `).join("");
    }

    document.addEventListener("click", (e) => {
      // Color select
      const colorBtn = e.target.closest("[data-color]");
      if (colorBtn) {
        const [pid, color] = colorBtn.dataset.color.split(":");
        if (!selectedSku[pid]) selectedSku[pid] = {};
        selectedSku[pid].color = color;
        selectedSku[pid].size = null;
        renderProducts();
        return;
      }
      // Size select
      const sizeBtn = e.target.closest("[data-size]");
      if (sizeBtn) {
        const [pid, size] = sizeBtn.dataset.size.split(":");
        if (!selectedSku[pid]) selectedSku[pid] = {};
        selectedSku[pid].size = size;
        renderProducts();
        return;
      }
      // Qty inc
      const incBtn = e.target.closest("[data-inc]");
      if (incBtn) {
        const pid = incBtn.dataset.inc;
        const sel = selectedSku[pid] || {};
        if (!sel.color || !sel.size) { toast("请先选择颜色和尺码"); return; }
        const key = comboKey(pid, sel.color, sel.size);
        quantities[key] = (quantities[key] || 1) + 1;
        renderProducts();
        return;
      }
      // Qty dec
      const decBtn = e.target.closest("[data-dec]");
      if (decBtn) {
        const pid = decBtn.dataset.dec;
        const sel = selectedSku[pid] || {};
        if (!sel.color || !sel.size) return;
        const key = comboKey(pid, sel.color, sel.size);
        if ((quantities[key] || 1) > 1) {
          quantities[key] = (quantities[key] || 1) - 1;
        }
        renderProducts();
        return;
      }
      // Add to cart
      const addBtn = e.target.closest("[data-add]");
      if (addBtn) {
        addToCart(addBtn.dataset.add);
        renderProducts();
        return;
      }
      // Remove cart item
      const removeBtn = e.target.closest("[data-remove]");
      if (removeBtn) {
        cart.splice(Number(removeBtn.dataset.remove), 1);
        updateCartUI();
        return;
      }
    });

    // Cart drawer
    $("cartBtn").addEventListener("click", () => {
      $("cartOverlay").classList.add("open");
    });

    $("cartOverlay").addEventListener("click", (e) => {
      if (e.target === $("cartOverlay")) {
        $("cartOverlay").classList.remove("open");
      }
    });

    // Checkout
    $("checkoutBtn").addEventListener("click", async () => {
      if (!cart.length) { toast("选购单为空"); return; }
      const name = $("contactName").value.trim();
      const phone = $("contactPhone").value.trim();
      if (!name) { toast("请输入联系人"); return; }

      const items = cart.map(i => ({ skuId: i.skuId, quantity: i.qty, unitPrice: i.unitPrice }));

      try {
        const res = await fetch("/api/share/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items, paidAmount: 0, contactName: name, contactPhone: phone }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || "提交失败");
        }
        const order = await res.json();
        cart = [];
        updateCartUI();
        $("cartOverlay").classList.remove("open");
        $("app").innerHTML = `
          <div class="order-success">
            <h2>✓ 采购单已提交</h2>
            <p>订单号：${order.orderNo || ""}</p>
            <p style="margin-top:8px">合计金额：¥${money(order.totalAmount)}</p>
            <p style="margin-top:24px;color:var(--muted)">客服将尽快与您联系确认</p>
            <button style="margin-top:24px;padding:12px 32px;border:0;border-radius:999px;background:var(--accent-dark);color:#fff;font-weight:800;font-size:16px;cursor:pointer" onclick="location.reload()">继续选购</button>
          </div>
        `;
      } catch (e) {
        toast(e.message || "提交失败，请重试");
      }
    });

    // Tab switching
    $("historyBtn").addEventListener("click", () => {
      $("productView").style.display = "none";
      $("historyView").style.display = "block";
      $("historyBtn").style.background = "var(--paper-strong)";
      $("cartBtn").style.background = "var(--paper)";
    });


    // History orders
    function renderOrders(orders) {
      const container = $("orderList");
      if (!orders || !orders.length) {
        container.innerHTML = `<p style="text-align:center;padding:40px 0;color:var(--muted)">暂无订单记录</p>`;
        return;
      }
      container.innerHTML = orders.map(o => `
        <div style="margin-bottom:12px;padding:14px;border-radius:10px;background:var(--paper);border:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <strong>${o.orderNo || ""}</strong>
            <span class="badge ${o.status === "CONFIRMED" ? "badge-confirmed" : o.status === "CANCELED" ? "badge-canceled" : "badge-draft"}">${
              o.status === "CONFIRMED" ? "已确认" : o.status === "CANCELED" ? "已取消" : "草稿"
            }</span>
          </div>
          <div style="font-size:13px;color:var(--muted)">
            <div>合计: <strong style="color:var(--accent-dark)">¥${money(o.totalAmount)}</strong> | 已付: ¥${money(o.paidAmount)} | 欠款: ¥${money(o.debtAmount)}</div>
            <div style="margin-top:4px">${o.createdAt ? new Date(o.createdAt).toLocaleString() : ""}</div>
          </div>
          ${(o.items || []).length ? `
          <details style="margin-top:8px;font-size:13px;color:var(--muted)">
            <summary style="cursor:pointer;font-weight:800">查看明细 (${o.items.length} 项)</summary>
            ${o.items.map(item => `
              <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
                <span>${item.productName || ""} ${item.colorName || ""} ${item.sizeName || ""} × ${item.quantity || 0}</span>
                <span>¥${money(item.amount)}</span>
              </div>
            `).join("")}
          </details>
          ` : ""}
        </div>
      `).join("");
    }

    $("historySearchBtn").addEventListener("click", async () => {
      const phone = $("historyPhone").value.trim();
      if (!phone) { toast("请输入手机号"); return; }
      try {
        const orders = await fetch(`/api/share/orders?phone=${encodeURIComponent(phone)}`).then(r => r.json());
        renderOrders(orders);
        if (!orders.length) toast("未找到该手机号的订单");
      } catch (e) {
        toast("查询失败: " + e.message);
      }
    });
    $("historyPhone").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("historySearchBtn").click();
    });

    // Back to products from history
    document.addEventListener("click", (e) => {
      const backBtn = e.target.closest("[data-back-to-products]");
      if (backBtn) {
        $("productView").style.display = "";
        $("historyView").style.display = "none";
        $("historyBtn").style.background = "var(--paper)";
      }
    });

    // // Load products
    fetch("/api/share/products")
      .then(r => r.json())
      .then(data => {
        products = data;
        renderProducts();
      })
      .catch(e => {
        $("productList").innerHTML = `<p style="text-align:center;padding:40px 0;color:var(--danger)">加载失败: ${e.message}</p>`;
      });
  </script>
</body>
</html>
